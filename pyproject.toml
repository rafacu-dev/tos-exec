[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tos-exec"
version = "1.4.0"
description = "Ejecucion de opciones en thinkorswim web Paper Money, solo metodos (sin UI): compra/venta por WebSocket, salida por porcentaje, posiciones, resumen y auto-login renovable."
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "certifi",
    "requests>=2.31",
]

[project.optional-dependencies]
# Solo para tos.automation / tos.ws_capture (fallback DOM y captura en un
# webview Qt que crea el HOST). El resto de la libreria no usa Qt.
qt = [
    "PySide6>=6.6",
]
# Login en un servidor sin pantalla (tos.headless_login / tos.servicio).
# Ademas: python -m playwright install --with-deps chromium
server = [
    "playwright>=1.45",
]

[tool.setuptools]
packages = ["tos"]
