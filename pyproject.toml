[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tos-exec"
version = "0.2.0"
description = "Ejecucion de opciones en thinkorswim web Paper Money, solo metodos (sin UI): ordenes por WebSocket, gestion de salidas por prima, receptor HTTP y automation DOM opcional."
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "certifi",
    "requests>=2.31",
]

[project.optional-dependencies]
# Solo para tos.automation / tos.ws_capture (fallback DOM y captura en un
# webview Qt que crea el HOST). El resto de la libreria no usa Qt.
qt = [
    "PySide6>=6.6",
]

[tool.setuptools]
packages = ["tos"]
